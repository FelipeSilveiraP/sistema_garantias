# Testes e seguranca do Sistema de Garantias, rodando no GitHub (com o notebook desligado).
# - "testes" (Windows, igual a loja): typecheck, build, JUnit, mascaras/filtros/automacoes e
#   os testes de tela com Electron (smoke, smoke-boot e persistencia).
# - "seguranca" (Linux, mais rapido): dependencias com vulnerabilidade conhecida (npm audit e
#   OSV-Scanner do Google) e analise do codigo (SpotBugs + Find Security Bugs e Semgrep).
# - "codeql": analise de seguranca do proprio GitHub (Java e TypeScript); os alertas aparecem
#   na aba Security do repositorio.
name: testes

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # toda segunda-feira as 6h (horario de Brasilia): pega vulnerabilidades novas nas dependencias
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencias do frontend (npm ci)
        run: npm ci

      - name: Tipagem (npm run typecheck)
        run: npm run typecheck

      - name: Build do frontend (npm run build)
        run: npm run build

      - name: Backend + JUnit (mvn package)
        run: mvn -B -f backend/pom.xml package

      - name: Mascaras, filtros e automacoes (npm run test:frontend)
        run: npm run test:frontend

      - name: Smoke de todas as telas (Electron)
        run: npx electron desktop/smoke.js

      - name: Persistencia (cold start do backend)
        run: node desktop/teste-persistencia.js

      # smoke-boot clica e digita de verdade (SendInput via desktop/entrada-real.ps1). O runner
      # do GitHub tem uma sessao de desktop, mas sem garantia de foco de janela: quando falhar
      # por foco, o resultado vale como aviso (nao bloqueia o PR). Rode na maquina para valer.
      - name: Smoke de boot com entrada real (pode falhar por foco no runner)
        continue-on-error: true
        run: npx electron desktop/smoke-boot.js

      - name: Guardar relatorios e capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          retention-days: 14
          path: |
            backend/target/surefire-reports/
            docs/responsivo/*.png

  seguranca:
    name: Seguranca (dependencias e analise estatica)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - run: npm ci

      # O que vai para o computador da loja (dependencias de execucao): bloqueia a partir de "high".
      - name: npm audit (o que vai no instalador)
        run: npm audit --omit=dev --audit-level=high

      # Ferramentas de build (electron-builder e seus pacotes): so aparecem no log. Elas rodam
      # na maquina de quem gera o instalador, nunca na loja (ver docs/seguranca.md).
      - name: npm audit (ferramentas de build, so relatorio)
        run: npm audit || true

      - name: OSV-Scanner nas dependencias Java (lista completa via SBOM)
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          mvn -B -q -f backend/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DincludeTestScope=false -DoutputFormat=json -DoutputName=sbom
          cp backend/target/sbom.json backend/target/dependencias.cdx.json
          "$(go env GOPATH)/bin/osv-scanner" scan source --config osv-scanner.toml -L backend/target/dependencias.cdx.json

      - name: OSV-Scanner no npm (so relatorio)
        run: '"$(go env GOPATH)/bin/osv-scanner" scan source -L package-lock.json || true'

      - name: SpotBugs + Find Security Bugs (Java)
        run: mvn -B -f backend/pom.xml -P seguranca -DskipTests package spotbugs:check

      - name: Semgrep
        run: |
          pip install --quiet semgrep==1.185.0
          # regras do proprio projeto (AGENTS.md): bloqueiam
          semgrep scan --metrics=off --error --config .semgrep/regras-projeto.yml
          # regras OWASP Top 10 do registro do Semgrep: relatorio
          semgrep scan --metrics=off --config p/owasp-top-ten --config p/java --config p/typescript --config p/javascript || true

  codeql:
    name: CodeQL (${{ matrix.linguagem }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguagem: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
