<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Todos os técnicos — Sistema de Garantias — Chaveiro Universal</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'">
<link href="../css/fonts.css" rel="stylesheet">
<link href="../dist/tailwind.css" rel="stylesheet">
</head><body class="bg-[#fcf9f8] text-[#1c1b1b] min-h-screen w-full font-headline antialiased" data-tela="todos-tecnicos">
<header id="nav-global"></header>
<div class="max-w-6xl mx-auto py-4 px-4 sm:px-6 flex flex-col gap-4">
<div class="w-full bg-white border-2 border-[#1c1b1b] px-4 py-3 sm:px-6 flex flex-wrap items-center justify-between gap-3">
<h1 class="text-lg sm:text-xl font-bold tracking-tight uppercase flex items-center gap-2"><span class="material-symbols-outlined text-xl sm:text-2xl font-bold">groups</span>Todos os técnicos</h1>
<button class="btn-acao bg-[#FFE600]" id="btnNovo" type="button"><span class="material-symbols-outlined text-base font-bold">add</span>CADASTRAR</button>
</div>
<div class="w-full bg-white border-2 border-[#1c1b1b] p-3 sm:p-4 flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3">
<div class="relative flex-1 min-w-0">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-lg">search</span>
<input class="w-full pl-9 pr-3 py-2 border-2 border-[#1c1b1b] bg-[#fcf9f8] text-sm font-medium focus:bg-white focus:outline-none uppercase" id="searchInput" placeholder="Pesquisar..." type="text" autocomplete="off">
</div>
<div class="flex flex-wrap items-center gap-2">
<button class="filter-btn active-filter" data-filter="TODOS" type="button">TODOS</button>
<button class="filter-btn" data-filter="ATIVOS" type="button">ATIVOS</button>
<button class="filter-btn" data-filter="INATIVOS" type="button">DESATIVADOS</button>
</div>
</div>
<p class="font-mono text-xs font-bold uppercase text-neutral-600" id="contador" aria-live="polite">—</p>
<main class="w-full bg-white border-2 border-[#1c1b1b] overflow-hidden">
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse" id="tabela">
<thead><tr class="bg-[#1d4ed8] text-white font-mono text-xs uppercase tracking-wider" id="cabecalho"></tr></thead>
<tbody class="divide-y divide-[#1c1b1b] text-sm font-semibold" id="tableBody"></tbody>
</table>
</div>
</main>
<div class="area-edicao-vazia aviso-selecao" id="selectionEmptyState"><span class="material-symbols-outlined text-2xl" aria-hidden="true">touch_app</span><p>Nenhum registro selecionado — clique em uma linha para editar.</p></div>
<section class="w-full bg-white border-2 border-[#1c1b1b] flex flex-col hidden" id="editorContainer" aria-labelledby="editorRecordName">
<div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-5 bg-white border-b-2 border-[#1c1b1b]">
<div class="flex items-center gap-3 min-w-0">
<span class="material-symbols-outlined text-2xl font-bold" aria-hidden="true">edit_note</span>
<div class="flex flex-col min-w-0">
<span class="text-xs font-mono font-bold uppercase tracking-wider">Selecionado</span>
<h2 class="text-base sm:text-lg font-bold uppercase tracking-tight truncate" id="editorRecordName">—</h2>
</div>
</div>
<button class="bg-white hover:bg-neutral-100 border-2 border-[#1c1b1b] font-mono text-xs font-bold px-3 py-1.5 flex items-center gap-1 cursor-pointer" id="btnClearSelection" type="button"><span class="material-symbols-outlined text-sm font-bold">close</span><span>FECHAR</span></button>
</div>
<div class="p-4 sm:p-5 flex flex-col gap-5">
<div class="flex flex-col gap-2">
<span class="font-mono text-xs font-bold uppercase text-neutral-600">Ações</span>
<div class="flex flex-wrap gap-2">
<button class="btn-acao bg-white hover:bg-neutral-100" id="btnAtivo" type="button"><span class="material-symbols-outlined text-base font-bold">toggle_on</span><span id="btnAtivoTexto">DESATIVAR</span></button>
<button class="btn-acao bg-white hover:bg-[#ffdad6] text-[#ba1a1a] sm:ml-auto" id="btnExcluir" type="button"><span class="material-symbols-outlined text-base font-bold">delete</span>EXCLUIR</button>
</div>
</div>
<div class="flex flex-col gap-2 border-t-2 border-dashed border-[#1c1b1b] pt-4">
<span class="font-mono text-xs font-bold uppercase text-neutral-600">Alterar um campo</span>
<div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-start" data-enter-envia="#btnApplyChange">
<div class="md:col-span-4 flex flex-col gap-1">
<label class="font-mono text-xs font-bold uppercase" for="fieldSelect">Campo</label>
<select class="w-full bg-[#fcf9f8] border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 focus:bg-white focus:outline-none uppercase cursor-pointer" id="fieldSelect"></select>
</div>
<div class="md:col-span-5 flex flex-col gap-1">
<label class="font-mono text-xs font-bold uppercase" for="newValueInput">Novo valor</label>
<input class="w-full bg-white border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 focus:bg-[#fff9d6] focus:outline-none" id="newValueInput" type="text" autocomplete="off">
<select class="hidden w-full bg-white border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 focus:bg-[#fff9d6] focus:outline-none cursor-pointer" id="newValueSelect" aria-label="Novo valor"></select>
<p class="campo-erro hidden" data-erro-campo="edicao"></p>
</div>
<div class="md:col-span-3 flex items-center gap-2 md:pt-5">
<button class="flex-1 bg-[#FFE600] hover:bg-[#ebd300] border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 shadow-[2px_2px_0px_0px_#1c1b1b] flex items-center justify-center gap-1.5 cursor-pointer" id="btnApplyChange" type="button"><span class="material-symbols-outlined text-base font-bold">check</span><span>APLICAR</span></button>
<button class="bg-white hover:bg-neutral-100 border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 cursor-pointer" id="btnCancelEdit" type="button"><span>DESFAZER</span></button>
</div>
</div>
</div>
</div>
</section>
</div>
<script type="module" src="../dist/app.js"></script>
</body></html>
