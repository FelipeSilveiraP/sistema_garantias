<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Pesquisar Garantia — Sistema de Garantias — Chaveiro Universal</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'">
<link href="../css/fonts.css" rel="stylesheet">
<link href="../dist/tailwind.css" rel="stylesheet">
</head><body class="bg-[#fcf9f8] text-[#1c1b1b] min-h-screen w-full font-headline antialiased selection:bg-[#FFE600] selection:text-black" data-tela="pesquisar-garantias">
<header id="nav-global"></header>
<div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 flex flex-col gap-4">
<header class="w-full flex flex-col gap-4">
<div class="w-full bg-white border-2 border-[#1c1b1b] px-4 py-3 sm:px-6 flex flex-wrap items-center justify-between gap-3">
<h1 class="text-lg sm:text-xl font-bold tracking-tight uppercase flex items-center gap-2 whitespace-nowrap"><span class="material-symbols-outlined text-xl sm:text-2xl font-bold">manage_search</span>Pesquisar garantia</h1>
<div class="flex flex-wrap gap-2">
<button class="btn-acao bg-white hover:bg-neutral-100" id="btnImportar" type="button"><span class="material-symbols-outlined text-base font-bold">upload_file</span>IMPORTAR PLANILHA ANTIGA</button>
<button class="btn-acao bg-[#FFE600]" id="btnImprimirLista" type="button"><span class="material-symbols-outlined text-base">print</span>IMPRIMIR LISTA</button>
</div>
<input class="hidden" id="inputPlanilha" type="file" accept=".xlsm,.xlsx">
</div>
<div class="w-full bg-white border-2 border-[#1c1b1b] p-3 sm:p-4 flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3">
<div class="relative flex-1 min-w-0 lg:min-w-[260px]">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-lg">search</span>
<input class="w-full pl-9 pr-3 py-2 border-2 border-[#1c1b1b] bg-[#fcf9f8] text-sm font-medium placeholder-gray-500 focus:bg-white focus:outline-none uppercase" id="searchInput" placeholder="Placa, CPF, modelo, serviço, técnico, data ou valor..." type="text" autocomplete="off">
</div>
<div class="flex flex-wrap items-center gap-2" id="filtros">
<button class="filter-btn active-filter" data-filter="MES" type="button">ESTE MÊS</button>
<button class="filter-btn" data-filter="ANO" type="button">ESTE ANO</button>
<button class="filter-btn" data-filter="TODOS" type="button">TODAS</button>
<button class="filter-btn" data-filter="SEMCUPOM" type="button">SEM CUPOM</button>
</div>
</div>
</header>
<p class="font-mono text-xs font-bold uppercase text-neutral-600" id="contador" aria-live="polite">—</p>
<main class="w-full bg-white border-2 border-[#1c1b1b] overflow-hidden">
<div class="overflow-x-auto">
<table class="tabela-colunas w-full text-left border-collapse" id="tabela">
<thead>
<tr class="bg-[#dc2626] text-white font-mono text-xs uppercase tracking-wider select-none">
<th class="py-3 px-3 whitespace-nowrap">DATA</th>
<th class="py-3 px-3 whitespace-nowrap">PLACA</th>
<th class="py-3 px-3">MODELO</th>
<th class="py-3 px-3 min-w-[180px]">SERVIÇO</th>
<th class="py-3 px-3 text-right whitespace-nowrap">VALOR</th>
<th class="py-3 px-3 whitespace-nowrap">TÉCNICO</th>
<th class="py-3 px-3 text-center whitespace-nowrap">CUPOM</th>
<th class="col-extra py-3 px-3 whitespace-nowrap">CPF</th>
<th class="col-extra py-3 px-3 min-w-[160px]">OBSERVAÇÃO</th>
<th class="col-extra py-3 px-3 whitespace-nowrap">CADASTRADA POR</th>
<th class="py-2 px-2 w-12 text-center"><button class="btn-expandir-colunas" id="btnExpandirColunas" type="button" aria-expanded="false" aria-controls="tabela" title="Mostrar mais colunas"><span aria-hidden="true">»</span><span class="sr-only">Mostrar mais colunas</span></button></th>
</tr>
</thead>
<tbody class="divide-y divide-[#1c1b1b] text-sm font-semibold" id="tableBody"></tbody>
</table>
</div>
</main>
<div class="area-edicao-vazia aviso-selecao" id="selectionEmptyState"><span class="material-symbols-outlined text-2xl" aria-hidden="true">touch_app</span><p>Nenhuma garantia selecionada — clique em uma linha para ver os detalhes e editar.</p></div>
<section class="w-full bg-white border-2 border-[#1c1b1b] flex flex-col hidden" id="editorContainer" aria-labelledby="editorRecordName">
<div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-5 bg-white border-b-2 border-[#1c1b1b]">
<div class="flex items-center gap-3 min-w-0">
<span class="material-symbols-outlined text-2xl font-bold" aria-hidden="true">edit_note</span>
<div class="flex flex-col min-w-0">
<span class="text-xs font-mono font-bold uppercase tracking-wider">Garantia selecionada</span>
<h2 class="text-base sm:text-lg font-bold uppercase tracking-tight truncate" id="editorRecordName">—</h2>
</div>
</div>
<button class="bg-white hover:bg-neutral-100 border-2 border-[#1c1b1b] font-mono text-xs font-bold px-3 py-1.5 flex items-center gap-1 cursor-pointer whitespace-nowrap" id="btnClearSelection" type="button"><span class="material-symbols-outlined text-sm font-bold">close</span><span>FECHAR</span></button>
</div>
<div class="p-4 sm:p-5 flex flex-col gap-5">
<div class="flex flex-col gap-2">
<span class="font-mono text-xs font-bold uppercase text-neutral-600">Ações</span>
<div class="flex flex-wrap gap-2">
<button class="btn-acao bg-[#4dffb2] hover:bg-[#22c55e]" id="btnCupomLancado" type="button"><span class="material-symbols-outlined text-base font-bold">receipt</span>CUPOM LANÇADO</button>
<button class="btn-acao bg-white hover:bg-neutral-100" id="btnCupomDispensado" type="button"><span class="material-symbols-outlined text-base font-bold">block</span>SEM CUPOM</button>
<button class="btn-acao bg-white hover:bg-neutral-100" id="btnCupomPendente" type="button"><span class="material-symbols-outlined text-base font-bold">undo</span>CUPOM PENDENTE</button>
<button class="btn-acao bg-white hover:bg-neutral-100" id="btnImprimir" type="button"><span class="material-symbols-outlined text-base font-bold">print</span>IMPRIMIR GARANTIA</button>
<button class="btn-acao bg-white hover:bg-[#ffdad6] text-[#ba1a1a] sm:ml-auto" id="btnExcluir" type="button"><span class="material-symbols-outlined text-base font-bold">delete</span>EXCLUIR</button>
</div>
</div>
<div class="flex flex-col gap-2 border-t-2 border-dashed border-[#1c1b1b] pt-4">
<span class="font-mono text-xs font-bold uppercase text-neutral-600">Alterar um campo</span>
<div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-start">
<div class="md:col-span-4 flex flex-col gap-1">
<label class="font-mono text-xs font-bold uppercase" for="fieldSelect">Campo</label>
<select class="w-full bg-[#fcf9f8] border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 focus:bg-white focus:outline-none uppercase cursor-pointer" id="fieldSelect"></select>
</div>
<div class="md:col-span-5 flex flex-col gap-1">
<label class="font-mono text-xs font-bold uppercase" for="newValueInput">Novo valor</label>
<input class="w-full bg-white border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 focus:bg-[#fff9d6] focus:outline-none" id="newValueInput" placeholder="Digite o novo valor..." type="text" autocomplete="off">
<select class="hidden w-full bg-white border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 focus:bg-[#fff9d6] focus:outline-none cursor-pointer" id="newValueSelect" aria-label="Novo valor"></select>
<p class="campo-erro hidden" data-erro-campo="edicao"></p>
</div>
<div class="md:col-span-3 flex items-center gap-2 md:pt-5">
<button class="flex-1 bg-[#FFE600] hover:bg-[#ebd300] border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 shadow-[2px_2px_0px_0px_#1c1b1b] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap" id="btnApplyChange" type="button"><span class="material-symbols-outlined text-base font-bold">check</span><span>APLICAR</span></button>
<button class="bg-white hover:bg-neutral-100 border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 flex items-center justify-center cursor-pointer whitespace-nowrap" id="btnCancelEdit" type="button"><span>DESFAZER</span></button>
</div>
</div>
</div>
</div>
</section>
</div>
<script type="module" src="../dist/app.js"></script>
</body></html>
