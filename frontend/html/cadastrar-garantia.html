<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Cadastrar Garantia — Sistema de Garantias — Chaveiro Universal</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'">
<link href="../css/fonts.css" rel="stylesheet">
<link href="../dist/tailwind.css" rel="stylesheet">
</head><body class="bg-[#fcf9f8] text-[#1c1b1b] min-h-screen w-full flex flex-col items-center px-4 sm:px-6 lg:px-8 font-headline" data-tela="cadastrar-garantia">
<header id="nav-global"></header>
<div class="w-full max-w-2xl flex flex-col gap-6 mt-4 sm:mt-5 mb-8">
<main class="w-full bg-white border-2 border-[#1c1b1b] p-5 sm:p-6">
<div class="flex items-center gap-3 pb-3 mb-4 border-b-2 border-[#1c1b1b]">
<div class="w-10 h-10 bg-[#FFE600] border-2 border-[#1c1b1b] flex items-center justify-center shadow-[2px_2px_0px_0px_#1c1b1b]">
<span class="material-symbols-outlined text-2xl text-[#1c1b1b]">post_add</span>
</div>
<h1 class="text-xl sm:text-2xl font-bold uppercase tracking-tight text-[#1c1b1b]">Cadastrar Garantia</h1>
</div>
<form class="flex flex-col gap-4" id="form-garantia" novalidate>
<!-- um campo embaixo do outro (vertical); a tela rola -->
<div class="flex flex-col gap-4">

<div class="campo-form">
<label class="rotulo-form" for="data_servico"><span>DATA DO SERVIÇO <strong class="text-[#ba1a1a]">*</strong></span></label>
<input class="entrada-form font-mono" id="data_servico" maxlength="10" placeholder="DD/MM/AAAA" type="text" autocomplete="off">
<p class="campo-erro hidden" data-erro-campo="dataServico"></p>
</div>

<div class="campo-form">
<label class="rotulo-form" for="tecnico"><span>TÉCNICO QUE REALIZOU O SERVIÇO <strong class="text-[#ba1a1a]">*</strong></span></label>
<select class="entrada-form" id="tecnico"><option value="">Selecione o técnico...</option></select>
<p class="campo-erro hidden" data-erro-campo="tecnico"></p>
</div>

<div class="campo-form">
<label class="rotulo-form" for="placa"><span>PLACA <strong class="text-[#ba1a1a]" id="placa-obrigatoria">*</strong></span><span class="dica-form">7 LETRAS E NÚMEROS</span></label>
<input class="entrada-form font-mono uppercase" id="placa" maxlength="8" placeholder="ABC1D23" type="text" autocomplete="off">
<label class="sem-placa" for="sem_placa"><input id="sem_placa" type="checkbox"><span class="sem-placa__caixa" aria-hidden="true"></span><span class="sem-placa__texto">CARRO SEM PLACA<small>Marque para liberar o CPF do cliente</small></span></label>
<p class="campo-erro hidden" data-erro-campo="placa"></p>
</div>

<div class="campo-form">
<label class="rotulo-form" for="cpf"><span>CPF DO CLIENTE <strong class="text-[#ba1a1a] hidden" id="cpf-obrigatorio">*</strong></span><span class="dica-form" id="cpf-dica">SÓ PARA CARRO SEM PLACA</span></label>
<input class="entrada-form entrada-form--bloqueada font-mono" id="cpf" maxlength="14" placeholder="000.000.000-00" type="text" autocomplete="off" disabled title="Liberado só para carro sem placa">
<p class="campo-erro hidden" data-erro-campo="cpf"></p>
</div>

<div class="campo-form">
<label class="rotulo-form" for="modelo_busca"><span>MODELO DO CARRO <strong class="text-[#ba1a1a]">*</strong></span><span class="dica-form">DIGITE OU ESCOLHA</span></label>
<!-- digita e a lista mostra os modelos que combinam (caixa-busca.ts); modelo fora da lista
     e salvo como foi escrito (OUTRO). A caixa escondida guarda o modelo escolhido. -->
<div class="caixa-busca">
<input class="entrada-form uppercase caixa-busca__campo" id="modelo_busca" maxlength="60" placeholder="Digite ou escolha o modelo..." type="text" autocomplete="off">
<button class="caixa-busca__seta" id="btn-lista-modelos" type="button" tabindex="-1" title="Ver todos os modelos" aria-label="Ver todos os modelos"><span class="material-symbols-outlined" aria-hidden="true">expand_more</span></button>
<ul class="caixa-busca__lista hidden" id="lista-modelos" aria-label="Modelos encontrados"></ul>
</div>
<select class="entrada-form hidden" id="modelo" tabindex="-1" aria-hidden="true"><option value="">Selecione o modelo...</option></select>
<!-- OUTRO: o campo de texto entra no lugar da caixa; o botao volta a lista de modelos -->
<div class="servico-outro hidden" id="bloco-modelo-outro">
<input class="entrada-form uppercase" id="modelo_outro" maxlength="60" placeholder="Escreva o modelo do carro" type="text" autocomplete="off" aria-label="Descreva o modelo do carro">
<button class="servico-outro__voltar" id="btn-voltar-modelos" type="button" title="Voltar à lista de modelos" aria-label="Voltar à lista de modelos"><span class="material-symbols-outlined" aria-hidden="true">format_list_bulleted</span></button>
</div>
<p class="campo-erro hidden" data-erro-campo="modelo"></p>
</div>

<div class="campo-form" id="campo-produtos">
<span class="rotulo-form"><span>PRODUTOS E SERVIÇOS <strong class="text-[#ba1a1a]">*</strong></span><span class="dica-form">+ ACRESCENTA OUTRO</span></span>
<!-- uma linha por produto: caixa do produto, quantidade, + (acrescenta abaixo) e X (tira) -->
<ol class="produtos-lista" id="produtos"></ol>
<p class="campo-erro hidden" data-erro-campo="servico"></p>
</div>

<div class="campo-form">
<label class="rotulo-form" for="valor"><span>VALOR (R$)</span></label>
<input class="entrada-form font-mono" id="valor" inputmode="numeric" placeholder="0,00" type="text" autocomplete="off">
<p class="campo-erro hidden" data-erro-campo="valor"></p>
</div>

</div>

<!-- observacao: linha abaixo de todos os campos, com uma seta que expande o cadastro para baixo -->
<div class="observacao-linha" id="bloco-observacao">
<div class="observacao-linha__barra" aria-hidden="true"></div>
<button class="observacao-linha__seta" id="btn-observacao" type="button" aria-expanded="false" aria-controls="observacao-corpo" title="Observação (opcional)" aria-label="Observação (opcional)"><span class="material-symbols-outlined" aria-hidden="true">arrow_downward</span></button>
<div class="observacao-linha__corpo" id="observacao-corpo">
<div class="campo-form">
<input class="entrada-form uppercase" id="observacao" maxlength="500" placeholder="Observação" type="text" autocomplete="off" aria-label="Observação">
<p class="campo-erro hidden" data-erro-campo="observacao"></p>
</div>
</div>
</div>

<div class="flex flex-wrap items-center justify-center gap-4 pt-2">
<button class="btn-secundario-form" id="btn-limpar" type="button"><span class="material-symbols-outlined text-lg">ink_eraser</span>LIMPAR</button>
<button class="btn-principal-form" id="btn-salvar" type="submit"><span class="material-symbols-outlined text-xl">save</span>SALVAR GARANTIA</button>
</div>
</form>
</main>
</div>
<script type="module" src="../dist/app.js"></script>
</body></html>
