<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Cadastrar veículo — Sistema de Garantias — Chaveiro Universal</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'">
<link href="../css/fonts.css" rel="stylesheet">
<link href="../dist/tailwind.css" rel="stylesheet">
</head><body class="bg-[#fcf9f8] text-[#1c1b1b] min-h-screen w-full flex flex-col items-center px-4 sm:px-6 font-headline" data-tela="form-veiculo">
<header id="nav-global"></header>
<div class="w-full max-w-3xl flex flex-col gap-6 mt-4 sm:mt-5 mb-8">
<main class="w-full bg-white border-2 border-[#1c1b1b] p-5 sm:p-6">
<div class="flex items-center gap-3 pb-3 mb-4 border-b-2 border-[#1c1b1b]">
<div class="w-10 h-10 bg-[#FF5E89] border-2 border-[#1c1b1b] flex items-center justify-center shadow-[2px_2px_0px_0px_#1c1b1b]"><span class="material-symbols-outlined text-2xl">directions_car</span></div>
<h1 class="text-xl sm:text-2xl font-bold uppercase tracking-tight">Cadastrar veículo</h1>
</div>
<form class="flex flex-col gap-4" id="form-cadastro" novalidate>
<div class="campo-form">
<label class="rotulo-form" for="marca"><span>MARCA <strong class="text-[#ba1a1a]">*</strong></span><span class="dica-form">OU "NOVA MARCA" NO FIM DA LISTA</span></label>
<select class="entrada-form" id="marca"><option value="">Selecione a marca...</option></select>
<input class="entrada-form uppercase hidden" id="marca_nova" maxlength="40" placeholder="Nome da nova marca" type="text" autocomplete="off">
<p class="campo-erro hidden" data-erro-campo="marca"></p>
</div>
<div class="campo-form">
<label class="rotulo-form" for="modelo"><span>MODELO <strong class="text-[#ba1a1a]">*</strong></span><span class="dica-form"></span></label>
<input class="entrada-form uppercase" id="modelo" maxlength="60" placeholder="Ex.: ONIX PLUS" type="text" autocomplete="off">
<p class="campo-erro hidden" data-erro-campo="modelo"></p>
</div>
<div class="flex flex-wrap items-center justify-center gap-4 pt-4 border-t-2 border-[#1c1b1b]">
<button class="btn-secundario-form" id="btn-limpar" type="button"><span class="material-symbols-outlined text-lg">ink_eraser</span>LIMPAR</button>
<button class="btn-principal-form" id="btn-salvar" type="submit"><span class="material-symbols-outlined text-xl">save</span>SALVAR</button>
</div>
</form>
</main>
</div>
<script type="module" src="../dist/app.js"></script>
</body></html>
