<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Gráficos — Sistema de Garantias — Chaveiro Universal</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'">
<link href="../css/fonts.css" rel="stylesheet">
<link href="../dist/tailwind.css" rel="stylesheet">
</head><body class="bg-[#fcf9f8] text-[#1c1b1b] min-h-screen w-full font-headline antialiased selection:bg-[#FFE600] selection:text-black" data-tela="graficos">
<header id="nav-global"></header>
<main class="max-w-7xl mx-auto flex flex-col gap-4 py-4 px-4 sm:px-6">
<header class="flex flex-wrap items-center justify-between gap-4 p-4 sm:p-5 bg-white border-2 border-black">
<div class="flex items-center gap-4">
<div class="flex items-center gap-3">
<div class="w-11 h-11 bg-[#00FF66] flex items-center justify-center border-2 border-black">
<span class="material-symbols-outlined text-black font-bold text-[26px]">bar_chart</span>
</div>
<h1 class="text-2xl sm:text-3xl font-bold uppercase tracking-tight text-black">GRÁFICOS</h1>
</div>
</div>
<div class="flex flex-wrap items-center gap-2 text-xs sm:text-sm">
<div class="flex items-center border-2 border-black bg-white p-1 gap-1" id="periodoGroup">
<button type="button" class="periodo-btn px-3 py-1.5 bg-[#00FF66] text-black border-2 border-black font-bold uppercase tracking-wider shadow-[2px_2px_0px_0px_#000]" data-periodo="mes">ESTE MÊS</button>
<button type="button" class="periodo-btn px-3 py-1.5 bg-white hover:bg-neutral-100 text-black font-bold uppercase tracking-wider transition-all" data-periodo="trimestre">ÚLTIMOS 3 MESES</button>
<button type="button" class="periodo-btn px-3 py-1.5 bg-white hover:bg-neutral-100 text-black font-bold uppercase tracking-wider transition-all" data-periodo="ano">ESTE ANO</button>
</div>
<button id="btn-imprimir" type="button" class="inline-flex items-center gap-1.5 px-3 py-2 bg-[#FFE600] text-black border-[3px] border-black text-xs sm:text-sm font-bold uppercase tracking-wider shadow-[3px_3px_0px_0px_#000] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[5px_5px_0px_0px_#000] active:translate-x-1 active:translate-y-1 active:shadow-none transition-all cursor-pointer">
<span class="material-symbols-outlined text-[18px]">print</span>
<span>IMPRIMIR</span>
</button>
</div>
</header>
<section class="grid grid-cols-1 md:grid-cols-3 gap-5">
<div class="bg-white border-2 border-black p-5 sm:p-6 flex flex-col justify-between">
<div class="flex items-center justify-between gap-2 mb-3"><span class="text-xs sm:text-sm font-bold uppercase tracking-wider">GARANTIAS NO PERÍODO</span><span class="selo bg-[#FFE600]">QUANTIDADE</span></div>
<div class="text-3xl sm:text-4xl font-bold text-black" id="kpiQuantidade">0</div>
<div class="mt-3 pt-3 border-t-2 border-black/10 text-xs text-black/70 uppercase font-bold" id="kpiQuantidadeSub">—</div>
</div><div class="bg-white border-2 border-black p-5 sm:p-6 flex flex-col justify-between">
<div class="flex items-center justify-between gap-2 mb-3"><span class="text-xs sm:text-sm font-bold uppercase tracking-wider">VALOR DOS SERVIÇOS</span><span class="selo bg-[#00FF66]/30 text-[#006c46]">TOTAL</span></div>
<div class="text-3xl sm:text-4xl font-bold text-[#006c46]" id="kpiTotal">0</div>
<div class="mt-3 pt-3 border-t-2 border-black/10 text-xs text-black/70 uppercase font-bold" id="kpiTotalSub">—</div>
</div><div class="bg-white border-2 border-black p-5 sm:p-6 flex flex-col justify-between">
<div class="flex items-center justify-between gap-2 mb-3"><span class="text-xs sm:text-sm font-bold uppercase tracking-wider">CUPOM FISCAL PENDENTE</span><span class="selo bg-[#ffdad6] text-[#ba1a1a]">SEM CUPOM</span></div>
<div class="text-3xl sm:text-4xl font-bold text-[#ba1a1a]" id="kpiSemCupom">0</div>
<div class="mt-3 pt-3 border-t-2 border-black/10 text-xs text-black/70 uppercase font-bold" id="kpiSemCupomSub">—</div>
</div>
</section>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
<section class="bg-white border-2 border-black p-5 sm:p-6">
<div class="flex items-center gap-2 pb-3 mb-4 border-b-2 border-black"><span class="material-symbols-outlined text-[20px]">show_chart</span><h2 class="text-sm sm:text-base font-bold uppercase tracking-wider">GARANTIAS POR MÊS (ÚLTIMOS 6 MESES)</h2></div>
<div class="flex items-end gap-3 h-44 overflow-x-auto pb-2" id="graficoMensal"></div>
</section><section class="bg-white border-2 border-black p-5 sm:p-6">
<div class="flex items-center gap-2 pb-3 mb-4 border-b-2 border-black"><span class="material-symbols-outlined text-[20px]">build</span><h2 class="text-sm sm:text-base font-bold uppercase tracking-wider">SERVIÇOS MAIS FEITOS</h2></div>
<div class="flex flex-col gap-3" id="graficoServicos"></div>
</section><section class="bg-white border-2 border-black p-5 sm:p-6">
<div class="flex items-center gap-2 pb-3 mb-4 border-b-2 border-black"><span class="material-symbols-outlined text-[20px]">engineering</span><h2 class="text-sm sm:text-base font-bold uppercase tracking-wider">POR TÉCNICO</h2></div>
<ol class="flex flex-col gap-2" id="graficoTecnicos"></ol>
</section><section class="bg-white border-2 border-black p-5 sm:p-6">
<div class="flex items-center gap-2 pb-3 mb-4 border-b-2 border-black"><span class="material-symbols-outlined text-[20px]">directions_car</span><h2 class="text-sm sm:text-base font-bold uppercase tracking-wider">MODELOS MAIS ATENDIDOS</h2></div>
<ol class="flex flex-col gap-2" id="graficoModelos"></ol>
</section>
</div>
</main>
<script type="module" src="../dist/app.js"></script>
</body></html>
